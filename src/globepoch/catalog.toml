# Globepoch map catalog.
#
# Every [[map]] needs: id, year, title, creator, place, source_page, credit, blurb, and either
#   iiif      = an IIIF Image API service URL (fetched in tiles and stitched), or
#   image_url = a direct link to a JPEG/PNG/TIFF scan.
#   date    = YYYY-MM-DD  -> scheduled for that day (dates must run from `epoch` with no gaps)
#   no date               -> backlog; used in file order once the scheduled days run out
#   crop    = [left, top, right, bottom]  fractions of the scan to keep (applied first)
#   redact  = [[l, t, r, b], ...]         fractions of the (cropped) image to black out —
#                                         printed years, library date stamps, call numbers…
#   max_px  = longest side of the tiled image (default 10000)
#
# Preview a map (and check its redactions) without waiting for its day:
#   python -m globepoch build --map <id> --out /tmp/preview
#
# All scans so far come from the Library of Congress IIIF image server (tile.loc.gov); its
# Geography & Map Division collections are free to use and reuse.

epoch = 2026-11-10
min_year = 1400

